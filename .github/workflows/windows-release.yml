name: Build Windows Helper Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: helper-release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag must match VERSION: v$version" }
          python -c "import ast, pathlib; p = pathlib.Path('soundboard-ptt.py'); tree = ast.parse(p.read_text()); version = next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '__version__' for t in n.targets)); assert version == pathlib.Path('VERSION').read_text().strip()"
      - name: Build standalone EXE
        shell: pwsh
        run: |
          python -m pip install "pyinstaller==6.22.2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exeName = "Giro-Soundboard-PTT-$env:RELEASE_TAG"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name $exeName soundboard-ptt.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash "dist/$exeName.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $exeName.exe" | Set-Content dist/SHA256SUMS.txt
      - name: Publish release files
        shell: pwsh
        run: |
          $exe = "dist/Giro-Soundboard-PTT-$env:RELEASE_TAG.exe"
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $exe dist/SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            $flags = @('--verify-tag', '--generate-notes')
            if ($env:RELEASE_TAG.Contains('-')) { $flags += @('--prerelease', '--latest=false') }
            gh release create $env:RELEASE_TAG $exe dist/SHA256SUMS.txt @flags --title "Push To Talk Helper $env:RELEASE_TAG" --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
